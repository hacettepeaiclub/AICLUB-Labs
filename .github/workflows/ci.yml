# The checks every change has to pass: on each pull request, and before every
# deploy (deploy.yml calls this workflow and waits for it).
#
# The same commands a contributor runs locally, in the order that fails
# fastest. `npm run size` is the bundle budget in tools/bundle-size.mjs; its
# table also appears on the run's summary page.
name: CI

on:
  pull_request:
  workflow_call:

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build (with prerender)
        run: npm run build
      # Every lab, in a real browser, against the build just made: no errors
      # on load, a tour for every stage, the learning guide opens, and no
      # serious accessibility finding (playwright.config.ts, e2e/).
      - name: Browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: npm run e2e
      - name: Keep the trace of a failed end-to-end test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Bundle size budget
        run: npm run size
      # On a push to main (deploy.yml calls this workflow), the build that just
      # passed every check is the one that ships: the server receives these
      # files and never builds anything itself.
      - name: Keep the build for the deploy
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 3
          if-no-files-found: error
