name: Deploy
on:
  push:
    branches: [main]

jobs:
  # The server builds the site itself, so a commit that does not build, or
  # fails its tests, used to be found out there, in production. Nothing reaches
  # it now until the checks a pull request runs have passed on this commit.
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    # Two quick merges deploy one after the other, never at the same time.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # The next version is built beside the live one, then copied into the
          # live dist/ in place. The directory itself must never be replaced:
          # the web server runs in a container that mounts dist/, and a mount
          # holds the directory it was given, not its name. Renaming a new
          # dist/ into place (as one version of this script did) left the
          # container serving the deleted old directory, empty, until it was
          # restarted. rsync writes into the same directory: new files first,
          # stale ones deleted only after everything new has arrived, so a page
          # never points at a bundle that is not there yet. `npm ci` installs
          # exactly the lockfile and never rewrites it. `set -e` stops at the
          # first failure with the old version still live.
          script: |
            set -e
            cd ~/labs
            git pull --ff-only origin main
            npm ci
            rm -rf dist-next
            OUT_DIR=dist-next npm run build
            mkdir -p dist
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete-after dist-next/ dist/
            else
              # No rsync: overwrite in place and leave stale hashed bundles,
              # which nothing links to, rather than empty the directory first.
              cp -a dist-next/. dist/
            fi
            rm -rf dist-next
