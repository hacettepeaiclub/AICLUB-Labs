name: Deploy
on:
  push:
    branches: [main]

jobs:
  # The server builds the site itself, so a commit that does not build, or
  # fails its tests, used to be found out there, in production. Nothing reaches
  # it now until the checks a pull request runs have passed on this commit.
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    # Two quick merges deploy one after the other, never at the same time.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # The next version is built beside the live one and swapped in with
          # two renames, so a visitor never meets a half-written dist/: the
          # build used to run inside the folder the server was serving, and
          # for the length of it pages and bundles went missing. `npm ci`
          # installs exactly the lockfile and never rewrites it, which a
          # plain `npm install` could, leaving the next `git pull` blocked by
          # a local change. `set -e` stops at the first failure with the old
          # version still live.
          script: |
            set -e
            cd ~/labs
            git pull --ff-only origin main
            npm ci
            rm -rf dist-next
            OUT_DIR=dist-next npm run build
            rm -rf dist-old
            if [ -d dist ]; then mv dist dist-old; fi
            mv dist-next dist
            rm -rf dist-old
