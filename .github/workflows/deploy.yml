name: Deploy
on:
  push:
    branches: [main]

jobs:
  # Nothing reaches the server until the checks a pull request runs have
  # passed on this commit. The same run builds the site and keeps the result.
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two quick merges deploy one after the other, never at the same time.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # The files CI built and checked, not a second build of the same commit.
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # Only the script that installs a release on the server; nothing is
      # built here.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
          sparse-checkout-cone-mode: false
          path: repo

      # The server used to pull the repository and build there: `npm ci` and
      # the whole toolchain ran on the production machine, as the deploy user,
      # on every merge. Now it only receives finished files.
      #
      # deploy/install-release.sh unpacks them beside the live site and copies
      # them into the live dist/ in place: the directory itself is never
      # replaced, because the web server's container mounts it (docs/DEPLOY.md).
      # Old hashed bundles under assets/ stay for the last two releases and
      # anything installed in the past seven days, so a visitor still running
      # the previous release can load its lazy chunks; everything else is
      # exactly the new release. rsync and cp only add files; the pruning is
      # one step after either, so both give the same dist/. `set -e` stops at
      # the first failure with the old version still live.
      #
      # The server's host key comes from the SSH_KNOWN_HOSTS secret when it is
      # set (see docs/DEPLOY.md), which is what stops a deploy from handing the
      # site to an impostor; without it the key is taken on trust, as the
      # previous action did.
      - name: Ship the build
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          ssh_opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes)

          tar -C dist -czf site.tgz .
          scp "${ssh_opts[@]}" site.tgz "$SSH_USER@$SSH_HOST:labs/site.tgz"
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" 'bash -s' < repo/deploy/install-release.sh
