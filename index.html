<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Club Labs — interactive experiences that teach Computer Science and AI." />
    <meta name="theme-color" content="#0a0a0f" />
    <!-- One logo, at two optical sizes — see tools/icons.mjs, which makes all
         of these from the mark the header draws. The 48 is listed first and
         with its size because a search engine wants a multiple of 48 and
         otherwise falls back to the touch icon, whose fine strands wash out
         at the 16–24px a result is shown at. `?v=2` because browsers keep
         favicons in a cache of their own that ignores HTTP headers, and the
         old slate-blue icon would otherwise outlive this change. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The two faces every page paints with. Preloaded so the swap happens
         before first paint rather than after it; the latin-ext companions are
         left to `unicode-range`, which fetches them only for Turkish. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>AI Club Labs</title>
    <script>
      // Runs before the stylesheet paints and before React exists, so a visitor
      // who chose light never sees a dark frame first. The markup already says
      // data-theme="dark", which is the default and also the correct answer for
      // anyone who has not chosen — so this only ever has work to do for
      // someone who has.
      (function () {
        try {
          var theme = localStorage.getItem("aiclub-labs-theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", theme === "light" ? "#f7f8fb" : "#0a0a0f");
          }
          var lang = localStorage.getItem("aiclub-labs-language");
          if (lang === "tr" || lang === "en") document.documentElement.setAttribute("lang", lang);
        } catch (e) {
          // Storage can be blocked outright; the defaults in the markup stand.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
