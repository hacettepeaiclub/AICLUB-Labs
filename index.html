<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI Club Labs — interactive experiences that teach Computer Science and AI."
    />
    <meta name="theme-color" content="#0a0a0f" />
    <!-- The deer alone, no ground: white on a dark browser, navy on a light
         one. The SVG does that with prefers-color-scheme; the .ico is the
         fallback for whatever does not draw SVG, and is navy because those
         places are mostly light. No sized PNGs on purpose — Chrome prefers an
         exact size match over the SVG and the tab would stop following the
         theme. All of it is made by tools/icons.mjs from the header's mark.
         `?v=3` because browsers keep favicons in a cache of their own. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="32x32" />
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The two faces every page paints with. Preloaded so the swap happens
         before first paint rather than after it; the latin-ext companions are
         left to `unicode-range`, which fetches them only for Turkish. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>AI Club Labs</title>
    <!-- Anonymous, cookieless visit counts (Umami); see src/app/analytics.ts.
         `data-domains` keeps dev servers, previews and forks from counting,
         and a browser sending Do Not Track is not counted at all. Deferred,
         so it never delays the page. -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="826cf45b-8285-46af-a46e-e7ae855a90a1"
      data-domains="labs.hacettepeaiclub.com"
      data-do-not-track="true"
    ></script>
    <script>
      // On the real site, an http address goes straight to its https twin.
      // The hashing lab needs a secure context, and a page that loaded over
      // http, from an old link or after a browser's "continue anyway", would
      // otherwise sit there unable to run it.
      if (location.protocol === "http:" && location.hostname === "labs.hacettepeaiclub.com") {
        location.replace(
          "https://" + location.host + location.pathname + location.search + location.hash,
        );
      }
      // Runs before the stylesheet paints and before React exists, so a visitor
      // who chose light never sees a dark frame first. The markup already says
      // data-theme="dark", which is the default and also the correct answer for
      // anyone who has not chosen — so this only ever has work to do for
      // someone who has.
      (function () {
        try {
          var theme = localStorage.getItem("aiclub-labs-theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", theme === "light" ? "#f7f8fb" : "#0a0a0f");
          }
          var lang = localStorage.getItem("aiclub-labs-language");
          if (lang === "tr" || lang === "en") document.documentElement.setAttribute("lang", lang);
        } catch (e) {
          // Storage can be blocked outright; the defaults in the markup stand.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
