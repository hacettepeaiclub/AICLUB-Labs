    <style>
      .boot-content {
        max-width: 42rem;
        margin: 12vh auto;
        padding: 1.5rem;
        font:
          1rem/1.6 system-ui,
          sans-serif;
        color: #ededf4;

      }
      [data-theme="light"] .boot-content a {
        color: #276238;
      }
    </style>
    <meta name="theme-color" content="#0a0a0f" />
    <!-- Green terminal mark, with a darker green for light browser chrome.
         Versioned URLs refresh the browser's separate favicon cache. -->
    <link rel="icon" href="/favicon.ico?v=4" sizes="32x32" />
    <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- One variable face for the whole site, including Turkish glyphs. -->
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Hacettepe AI Club Labs | Computer Science &amp; AI Experiments</title>
    <!-- Anonymous, cookieless visit counts (Umami); see src/app/analytics.ts.
         `data-domains` keeps dev servers, previews and forks from counting,
         and a browser sending Do Not Track is not counted at all. Deferred,
         so it never delays the page. -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="826cf45b-8285-46af-a46e-e7ae855a90a1"
      data-domains="labs.hacettepeaiclub.com"
      data-do-not-track="true"
    ></script>
    <script>
      // On the real site, an http address goes straight to its https twin.
      // The hashing lab needs a secure context, and a page that loaded over
      // http, from an old link or after a browser's "continue anyway", would
      // otherwise sit there unable to run it.
      if (location.protocol === "http:" && location.hostname === "labs.hacettepeaiclub.com") {
        location.replace(
          "https://" + location.host + location.pathname + location.search + location.hash,
        );
      }
      // Runs before the stylesheet paints and before React exists, so a visitor
      // who chose light never sees a dark frame first. The markup already says
      // data-theme="dark", which is the default and also the correct answer for
      // anyone who has not chosen — so this only ever has work to do for
      // someone who has.
      (function () {
        try {
          var theme = localStorage.getItem("aiclub-labs-theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", theme === "light" ? "#f7f8fb" : "#0a0a0f");
          }
          var lang = localStorage.getItem("aiclub-labs-language");
          if (lang === "tr" || lang === "en") document.documentElement.setAttribute("lang", lang);
          // A Turkish visitor's dictionary is fetched alongside the entry
          // bundle instead of after it. The address is written in by
          // tools/prerender.mjs; on the dev server it is left as a
          // placeholder and nothing is preloaded.
          var trShell = "__TR_SHELL__";
          if (lang === "tr" && trShell.indexOf("__") !== 0) {
            var link = document.createElement("link");
            link.rel = "modulepreload";
            link.crossOrigin = "";
            link.href = trShell;
            document.head.appendChild(link);
          }
        } catch (e) {
          // Storage can be blocked outright; the defaults in the markup stand.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- boot:start -->
      <main class="boot-content">
        <h1>Hacettepe AI Club Labs</h1>
        <p>Interactive experiments in computer science and artificial intelligence.</p>
        <p>Loading the experiments…</p>
      </main>
      <!-- boot:end -->
    </div>
    <!-- static-noscript:start -->
    <noscript
      ><p class="boot-content">
        Enable JavaScript to use the interactive experiments.
        <span lang="tr">Deneyleri kullanmak için tarayıcında JavaScript’i etkinleştir.</span>
      </p></noscript
    >
    <!-- static-noscript:end -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
