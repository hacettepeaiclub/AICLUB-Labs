# The nginx that serves the built site, inside the `labs_site` container.
#
# On the server this file lives at /root/labs-nginx/default.conf, and the
# container mounts that folder as /etc/nginx/conf.d. It is kept here so the
# configuration is versioned with the site it serves; see docs/DEPLOY.md for
# how to apply a change and how to recreate the container.
#
# TLS ends at Nginx Proxy Manager in front of this container, so every request
# that reaches here arrives over plain http on port 80.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # Adding a directory's trailing slash must not downgrade https to http.
    # With absolute redirects nginx wrote `Location: http://…` (it only ever
    # sees http), which browsers set to always use secure connections treated
    # as https being unsupported. A relative Location keeps the scheme.
    absolute_redirect off;

    # Compress text, including behind the proxy: without `gzip_proxied any`
    # nginx compresses nothing that arrives with a `Via` header.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json
               image/svg+xml application/xml text/plain application/manifest+json;

    # An address with no page gets the app's not-found page and a real 404.
    # Every page the site has is a file (tools/prerender.mjs writes one per
    # route), so nothing needs the old fallback to /index.html, which
    # answered 200 to any address at all: typos were indexed as pages, and
    # a broken link looked like a working one to every checker.
    error_page 404 /404.html;

    # The bundles are content-hashed: a file at a given address never changes.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    # Pages are revalidated on every visit, so a page from yesterday never
    # points at a bundle today's build deleted. Every `add_header` is repeated
    # per location because one inside a location drops all inherited ones.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        # Other sites learn which site a visitor came from, never which page,
        # and no page here can ask for a camera, a microphone or a location:
        # nothing on the site needs them, so nothing injected can use them.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }
}
